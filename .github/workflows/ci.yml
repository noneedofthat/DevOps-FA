name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check for emojis (Strict Constraint)
        run: |
          if grep -rP '[\x{1F600}-\x{1F64F}]|[\x{1F300}-\x{1F5FF}]|[\x{1F680}-\x{1F6FF}]|[\x{1F700}-\x{1F77F}]|[\x{1F780}-\x{1F7FF}]|[\x{1F800}-\x{1F8FF}]|[\x{1F900}-\x{1F9FF}]|[\x{1FA00}-\x{1FA6F}]|[\x{1FA70}-\x{1FAFF}]|[\x{2600}-\x{26FF}]|[\x{2700}-\x{27BF}]' src/; then
            echo "Emojis are strictly prohibited!"
            exit 1
          fi

      - name: Run Linter
        run: npm run lint

      - name: Run Build
        run: npm run build

  deploy-aws:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build Frontend Image
        run: docker build -t hackathon-frontend .
        
      - name: Build Backend Image
        run: docker build -t hackathon-backend ./backend
        
      - name: Log in to Docker Hub (or ECR)
        # Placeholder for registry login
        run: echo "Login to registry..."
        
      - name: Push Docker Image
        # Placeholder for registry push
        run: echo "Pushing image..."

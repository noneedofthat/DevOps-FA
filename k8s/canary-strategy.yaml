# Continuous Deployment Strategy: Canary Release via NGINX Ingress Annotations
# Demonstrates 10% traffic routing to Canary version and 90% to Stable version
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment-canary
  namespace: hackathon
  labels:
    app: hackathon-backend
    version: v1.3.0-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-backend
      version: v1.3.0-canary
  template:
    metadata:
      labels:
        app: hackathon-backend
        version: v1.3.0-canary
    spec:
      containers:
      - name: backend-canary
        image: node:18-alpine
        command:
        - "node"
        - "-e"
        - |
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ status: 'HEALTHY', tier: 'Canary v1.3.0 (10% Traffic)', uptime: process.uptime() }));
          }).listen(5000, () => console.log('Canary listening 5000'));
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service-canary
  namespace: hackathon
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: hackathon-backend
    version: v1.3.0-canary
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress-canary
  namespace: hackathon
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10" # Routes 10% of traffic to Canary
spec:
  rules:
  - host: portal.hackgrid.internal
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service-canary
            port:
              number: 5000

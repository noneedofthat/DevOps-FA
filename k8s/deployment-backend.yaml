apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: hackathon
  labels:
    app: hackathon-backend
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hackathon-backend
  template:
    metadata:
      labels:
        app: hackathon-backend
        tier: api
        version: v1.2.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: node:18-alpine
        command:
        - "node"
        - "-e"
        - |
          const http = require('http');
          http.createServer((req, res) => {
            if (req.url === '/api/health') {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ status: 'HEALTHY', tier: 'Kubernetes Production Workload', uptime: process.uptime() }));
            } else if (req.url === '/metrics') {
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end('http_requests_total 100\nk8s_pod_health_status 1\n');
            } else {
              res.writeHead(200);
              res.end('HackGrid Backend API Active');
            }
          }).listen(5000, () => console.log('Listening on port 5000'));
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: persistent-storage
          mountPath: /app/uploads
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: backend-uploads-pvc

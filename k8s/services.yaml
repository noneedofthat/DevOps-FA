apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: hackathon
  labels:
    app: hackathon-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: hackathon-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: hackathon
  labels:
    app: hackathon-backend
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http-api
  selector:
    app: hackathon-backend

# Logstash Processing Pipeline (Unit IV: Centralized Logging)
input {
  beats {
    port => 5044
  }
  tcp {
    port => 50000
    codec => json_lines
  }
}

filter {
  if [service] == "hackathon-backend" {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Classify HTTP Status Codes for Kibana visual analytics
    if [statusCode] >= 500 {
      mutate { add_tag => [ "http_server_error", "sre_incident_alert" ] }
    } else if [statusCode] >= 400 {
      mutate { add_tag => [ "http_client_error" ] }
    } else {
      mutate { add_tag => [ "http_success" ] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hackathon-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
